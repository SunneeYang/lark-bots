    app_secret: "test_secret_executor_1_def"
    role: "executor"
    allowed_dispatchers:
      - "cli_test_dispatcher_123"
    task_scripts:
      deploy: "/Users/hortor/Documents/work/lark/test/scripts/deploy.sh"
      health_check: "/Users/hortor/Documents/work/lark/test/scripts/health_check.sh"
      backup: "/Users/hortor/Documents/work/lark/test/scripts/backup.sh"
      cleanup_logs: "/Users/hortor/Documents/work/lark/test/scripts/cleanup_logs.sh"
      test: "/Users/hortor/Documents/work/lark/test/scripts/test.sh"
      fail: "/Users/hortor/Documents/work/lark/test/scripts/fail.sh"

  # 脚本执行机器人 2 (可选)
  - name: "test-executor-2"
    app_id: "cli_test_executor_2_789"
    app_secret: "test_secret_executor_2_ghi"
